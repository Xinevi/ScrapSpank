name: Publish v1.2 (scheduled)

on:
  schedule:
    - cron: '0 15 10 8 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the v1.2 draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rid=$(gh api repos/Xinevi/ScrapSpank/releases --paginate -q '.[] | select(.tag_name=="v1.2") | .id' | head -n1)
          if [ -z "$rid" ]; then
            echo 'no v1.2 draft found'
          else
            gh api -X PATCH repos/Xinevi/ScrapSpank/releases/$rid -f draft=false
          fi
