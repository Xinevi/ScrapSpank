name: Publish v1.2 (scheduled)

on:
  schedule:
    - cron: '0 15 10 8 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the v1.2 draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release publish v1.2 --repo Xinevi/ScrapSpank || echo 'publish failed or already done'