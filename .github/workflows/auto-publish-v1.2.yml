name: Auto-publish Release v1.2

on:
  schedule:
    - cron: '30 13 9 8 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: releases } = await github.rest.repos.listReleases({ owner, repo, per_page: 100 });
            const draft = releases.find(r => r.draft && r.name === 'Release v1.2');
            if (!draft) {
              console.log('Draft "Release v1.2" not found, nothing to publish.');
              return;
            }
            await github.rest.repos.updateRelease({
              owner, repo, release_id: draft.id,
              tag_name: 'v1.2', name: 'Release v1.2',
              draft: false, prerelease: false, make_latest: true
            });
            console.log('Published Release v1.2 (id=' + draft.id + ') with tag v1.2');
